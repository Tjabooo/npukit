# npukit configuration: ~/.config/npukit/config.toml
# Every key is optional; the values below are the built-in defaults.

[server]
listen = "127.0.0.1:13306"   # also change ListenStream= in npud.socket if you change this
flm = "flm"                  # FastFlowLM binary (1.0.12+), or a path like "~/fastflowlm/flm"
flm_port = 13307             # private port of the flm child process (localhost only)
flm_args = []                # extra `flm serve` arguments, e.g. ["--ctx-len", "16384"]
max_components = 2           # XDNA2 fits a chat model + one helper (Whisper or embeddings)
exit_after = 60              # socket-activated gateway exits after this long with nothing loaded
backend = "flm"              # flm = FastFlowLM on the NPU; "llamacpp" = llama.cpp + whisper.cpp (GPU/CPU)
memory_guard_gb = 1.5        # memory pressure + less RAM available than this = model servers killed at once; 0 = off

# Only used with backend = "llamacpp" (machines without an XDNA2 NPU). Each component runs as its own
# server on flm_port + 0 / 1 / 2 (chat / speech / embeddings), loaded on demand, unloaded on idle.
[llamacpp]
server = "llama-server"      # llama.cpp (Arch: pacman -S llama-cpp ggml-vulkan)
whisper = "whisper-server"   # whisper.cpp (Arch: pacman -S whisper-cpp)
label = "GPU"                # shown in notifications, the bar tooltip and `npu status`
max_components = 3           # chat + Whisper + embeddings all stay loaded on a GPU
vram_reserve = 0.2           # keep 20% of VRAM free for other apps: llama.cpp --fit-target; what doesn't fit
                             # goes to RAM (MoE experts first); Whisper moves to the CPU at the reserve
ram_reserve_gb = 4           # refuse to load a model whose RAM share would leave less than this available
threads = 0                  # CPU threads for whatever runs on the CPU (0 = all cores), e.g. 6 of 8 for headroom
args = ["-c", "16384", "-np", "1", "--no-webui"]   # every chat llama-server (no -ngl: --fit decides)
whisper_model = "~/.local/share/npukit-engines/models/ggml-large-v3-turbo.bin"
whisper_args = ["-l", "auto"]
embed_model = "embed-gemma:300m"
# With this backend and no [models.aliases] in this file: fast = vision = "qwen3.5:9b", quality = "qwen3.6:35b-a3b".
# [llamacpp.models]          # tag = { path = "….gguf", mmproj = "….gguf" } or { hf = "user/repo:quant" }
# "qwen3.5:9b" = { path = "~/.local/share/npukit-engines/models/Qwen3.5-9B-Q4_K_M.gguf", mmproj = "~/.local/share/npukit-engines/models/Qwen3.5-9B-mmproj-F16.gguf" }
# "qwen3.6:35b-a3b" = { path = "~/.local/share/npukit-engines/models/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf" }
# "gpt-oss:20b" = { hf = "ggml-org/gpt-oss-20b-GGUF", args = ["-c", "32768"] }

[models]
default = "fast"             # used when a request names no model
# Names usable as "model" in any request. Uncomment to change them; the defaults depend on the backend.
# With backend = "llamacpp" the values must be [llamacpp.models] tags.
# [models.aliases]
# fast = "qwen3.5:4b"        # everyday chat/coding (vision too)      llamacpp default: qwen3.5:9b
# quality = "gpt-oss:20b"    # slower, better answers                  llamacpp default: qwen3.6:35b-a3b
# vision = "qwen3vl-it:4b"   # OCR / describing screenshots            llamacpp default: qwen3.5:9b

[power]
ac_online = ""               # path to the AC adapter's "online" file; empty = auto-detect
ac_pmode = "balanced"        # flm --pmode: powersaver | balanced | performance | turbo
battery_pmode = "powersaver"
ac_idle_unload = 600         # seconds without a request before the NPU is freed
battery_idle_unload = 120

[bar]
file = "~/.local/state/npukit/bar.json"   # waybar: "exec": "cat <file>", "signal": <signal>
signal = 16                  # RTMIN+16 is sent to waybar on every change; 0 = off
tag = "NPU"
# colors = { tag = "#9b5de5", dim = "#6c6c8a", text = "#babbf1", hot = "#f15bb5", load = "#00c6ff", rec = "#ff5252" }

[dictate]
record = ["pw-record", "--rate", "16000", "--channels", "1", "--format", "s16"]
max_seconds = 120
language = ""                # empty = auto-detect, or "en", "sv", ...
prompt = ""                  # spelling hints: names, jargon
type = ["wtype", "-"]        # how text gets typed; skipped when the tool isn't installed
copy = true                  # also put the text on the clipboard
min_rms = 120                # quieter recordings count as silence

[ocr]
capture = ["hyprshot", "-z", "-s", "-m", "region", "--raw"]   # any command that prints a PNG
model = "vision"
translate_to = "English"     # `npu ocr --translate` without a language (names or codes: sv, de, ja, ...)
translate_model = "fast"     # chat model that translates the text the vision model read
translate_ocr_model = ""     # model that reads the region when translating ("" = model above); one model
                             # for both (e.g. "quality" with a vision projector) avoids a swap per capture
translate_context = ""       # appended to the (faithful, uncensored) translate prompt: source, slang, names

[translate]
# `npu translate` overlay (eww). Model: [ocr] translate_model unless set here.
# model = "quality"
languages = ["English", "Swedish", "German", "French", "Spanish", "Japanese"]  # chips after recent ones
type = ["wtype", "-"]        # Enter again types the translation into the window underneath; [] = only copy
on_open = []                 # e.g. enter a Hyprland submap so Esc closes it (README → Hyprland)
on_close = []
# font = "JetBrainsMono Nerd Font"
# [translate.colors]         # bg panel line fg dim accent accent2 error
# accent = "#7aa2f7"

[ui]
menu_theme = ""              # rofi -theme for `npu menu`, e.g. "~/.config/rofi/npu.rasi"
menu_close_wait = 0.45       # seconds the menu gets to fade out before a region selection freezes the screen
search_theme = ""            # rofi -theme for `npu search --rofi`
lang_theme = ""              # rofi -theme for the `npu ocr --pick` language list (empty = menu_theme)

[search]
roots = ["~/workspace", "~/Documents"]
db = "~/.local/share/npukit/index.sqlite"
results = 12
open = ["xdg-open", "{path}"]   # e.g. ["code", "-g", "{path}:{line}"]
exclude_globs = ["*.min.*", "*.map", "*-lock.json", "*.lock", "*/third_party/*",
                 "*/external/*", "*/wp-includes/*", "*/wp-admin/*", "*/site-packages/*"]
max_file_kb = 384
max_chunks_per_file = 40
chunk_lines = 60
overlap_lines = 8
